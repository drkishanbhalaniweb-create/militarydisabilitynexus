name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'supabase/**'
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'supabase/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY != '' && secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
      NEXT_PUBLIC_CAL_URL_DISCOVERY: ${{ secrets.NEXT_PUBLIC_CAL_URL_DISCOVERY != '' && secrets.NEXT_PUBLIC_CAL_URL_DISCOVERY || 'https://cal.com/militarydisabilitynexus/discovery-call-military-disability-nexus' }}
      NEXT_PUBLIC_CAL_URL_CONSULTATION: ${{ secrets.NEXT_PUBLIC_CAL_URL_CONSULTATION != '' && secrets.NEXT_PUBLIC_CAL_URL_CONSULTATION || 'https://cal.com/militarydisabilitynexus/claim-readiness-review' }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST != '' && secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
      NEXT_PUBLIC_ENABLE_HEALTH_CHECK: 'false'
      NEXT_PUBLIC_ENABLE_VISUAL_EDITS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/pages/**/*', 'frontend/src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and API tests
        run: npm run test:run

      - name: Build
        run: npm run build

  e2e-smoke:
    name: E2E smoke & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY != '' && secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
      NEXT_PUBLIC_CAL_URL_DISCOVERY: ${{ secrets.NEXT_PUBLIC_CAL_URL_DISCOVERY != '' && secrets.NEXT_PUBLIC_CAL_URL_DISCOVERY || 'https://cal.com/militarydisabilitynexus/discovery-call-military-disability-nexus' }}
      NEXT_PUBLIC_CAL_URL_CONSULTATION: ${{ secrets.NEXT_PUBLIC_CAL_URL_CONSULTATION != '' && secrets.NEXT_PUBLIC_CAL_URL_CONSULTATION || 'https://cal.com/militarydisabilitynexus/claim-readiness-review' }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST != '' && secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
      NEXT_PUBLIC_ENABLE_HEALTH_CHECK: 'false'
      NEXT_PUBLIC_ENABLE_VISUAL_EDITS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  supabase-and-functions:
    name: Supabase and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions syntax and types
        run: |
          echo "Checking Supabase Edge Functions..."
          find supabase/functions -name "*.ts" ! -name "*.d.ts" | while read -r file; do
            echo "Linting $file..."
            deno check "$file" || echo "::warning file=$file::Type check warning in $file"
          done

      - name: Migration validation
        run: |
          set -euo pipefail
          echo "Validating SQL migrations..."
          count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          echo "Found ${count} Supabase migration files."
          if [ "$count" -eq 0 ]; then
            echo "::error::No migration files found in supabase/migrations"
            exit 1
          fi
          # Check for empty migration files
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -empty -exec echo "::warning::Empty migration file found: {}" \;

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Supabase CLI version
        run: supabase --version

      - name: Supabase linked db lint status
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::notice title=Supabase db lint notice::supabase/config.toml is missing in repo root. Local or linked db lint will run when configured."
          fi

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ] || [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::notice title=Supabase linked lint notice::Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_ID repository secrets to enable linked db lint."
          fi

      - name: Supabase linked db lint
        if: ${{ hashFiles('supabase/config.toml') != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"
          supabase db lint --linked --fail-on error

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependency review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Secret scan
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          extra_args: --results=verified,unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  ci-gate:
    name: CI Pipeline Gate
    needs:
      - frontend-quality
      - e2e-smoke
      - supabase-and-functions
      - security-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pipeline results
        run: |
          echo "## 🚀 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Quality (Lint, Unit & API Tests, Next.js Build) | ${{ needs.frontend-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright E2E & Smoke Tests | ${{ needs.e2e-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase & Edge Functions Checks | ${{ needs.supabase-and-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Checks (TruffleHog, Dependency Review, Audit) | ${{ needs.security-checks.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.frontend-quality.result }}" != "success" || \
                "${{ needs.e2e-smoke.result }}" != "success" || \
                "${{ needs.supabase-and-functions.result }}" != "success" || \
                "${{ needs.security-checks.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed. Check individual job logs for details."
            exit 1
          fi
          echo "✅ All CI checks passed successfully!"
